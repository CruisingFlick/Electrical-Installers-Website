openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Electrical Installers business management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat operations
  - name: bookings
    description: Customer booking requests
  - name: portfolio
    description: Job portfolio management
  - name: reviews
    description: Customer reviews
  - name: quotes
    description: Virtual quote requests
  - name: analytics
    description: Site analytics and dashboard stats
  - name: jobs
    description: Job tracking with map pins
  - name: media
    description: Media library for photo management
  - name: customers
    description: Customer archive and CRM

paths:
  /admin/media:
    get:
      operationId: listMediaItems
      tags: [media]
      summary: List all media library items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of media items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"
    post:
      operationId: createMediaItem
      tags: [media]
      summary: Upload a new photo to the media library
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMediaItemBody"
      responses:
        "201":
          description: Created media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"

  /admin/media/{id}:
    patch:
      operationId: updateMediaItem
      tags: [media]
      summary: Update media item title/category/tags
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                category:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        "200":
          description: Updated media item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaItem"
    delete:
      operationId: deleteMediaItem
      tags: [media]
      summary: Delete a media item
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/ai-settings:
    get:
      operationId: getAiSettings
      tags: [admin]
      summary: Get AI chat settings (system prompt)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"
    put:
      operationId: updateAiSettings
      tags: [admin]
      summary: Update AI chat settings (system prompt)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAiSettingsBody"
      responses:
        "200":
          description: Updated AI settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiSettings"

  /openai/conversations:
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List all bookings
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, confirmed, completed, cancelled]
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Submit a new booking request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingBody"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}/confirm:
    post:
      operationId: confirmBooking
      tags: [bookings]
      summary: Confirm a booking and notify the customer by email
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmBookingBody"
      responses:
        "200":
          description: Booking confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBookingStatusBody"
      responses:
        "200":
          description: Updated booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    delete:
      operationId: deleteBooking
      tags: [bookings]
      summary: Delete a booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/customers:
    get:
      operationId: listCustomers
      tags: [customers]
      summary: List all customers in the archive
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of customers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Customer"

  /admin/customers/{id}:
    get:
      operationId: getCustomer
      tags: [customers]
      summary: Get a customer with their full booking history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Customer with bookings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerWithBookings"
    patch:
      operationId: updateCustomer
      tags: [customers]
      summary: Update customer marketing notes and tags
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCustomerBody"
      responses:
        "200":
          description: Updated customer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Customer"

  /portfolio:
    get:
      operationId: listPortfolioItems
      tags: [portfolio]
      summary: List portfolio items
      parameters:
        - name: category
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Portfolio items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortfolioItem"
    post:
      operationId: createPortfolioItem
      tags: [portfolio]
      summary: Add a new portfolio item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePortfolioItemBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItem"

  /portfolio/reorder:
    put:
      operationId: reorderPortfolioItems
      tags: [portfolio]
      summary: Reorder portfolio items
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderPortfolioItemsBody"
      responses:
        "204":
          description: Reordered

  /portfolio/{id}:
    put:
      operationId: updatePortfolioItem
      tags: [portfolio]
      summary: Update a portfolio item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePortfolioItemBody"
      responses:
        "200":
          description: Updated portfolio item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortfolioItem"
        "404":
          description: Not found
    delete:
      operationId: deletePortfolioItem
      tags: [portfolio]
      summary: Delete a portfolio item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /reviews:
    get:
      operationId: listReviews
      tags: [reviews]
      summary: List reviews
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: createReview
      tags: [reviews]
      summary: Submit a customer review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReviewBody"
      responses:
        "201":
          description: Review submitted (pending approval)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /reviews/{id}:
    patch:
      operationId: updateReviewStatus
      tags: [reviews]
      summary: Approve or reject a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateReviewStatusBody"
      responses:
        "200":
          description: Updated review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
    delete:
      operationId: deleteReview
      tags: [reviews]
      summary: Delete a review
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /quotes:
    get:
      operationId: listQuotes
      tags: [quotes]
      summary: List all quote requests
      responses:
        "200":
          description: Quote requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteRequest"
    post:
      operationId: createQuote
      tags: [quotes]
      summary: Submit a virtual quote request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateQuoteBody"
      responses:
        "201":
          description: Quote request submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"

  /quotes/{id}:
    patch:
      operationId: updateQuoteStatus
      tags: [quotes]
      summary: Update quote status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateQuoteStatusBody"
      responses:
        "200":
          description: Updated quote
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteRequest"

  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get dashboard summary stats
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  /analytics/bookings-by-service:
    get:
      operationId: getBookingsByService
      tags: [analytics]
      summary: Bookings grouped by service type
      responses:
        "200":
          description: Bookings by service
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceCount"

  /analytics/bookings-by-region:
    get:
      operationId: getBookingsByRegion
      tags: [analytics]
      summary: Bookings grouped by region/suburb
      responses:
        "200":
          description: Bookings by region
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RegionCount"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List all jobs with map coordinates
      responses:
        "200":
          description: Jobs list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a new job record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobBody"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    patch:
      operationId: updateJobStatus
      tags: [jobs]
      summary: Update job status (changes map pin colour)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateJobStatusBody"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Booking:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        serviceType:
          type: string
          enum: [consulting, quoting, work]
        jobType:
          type: string
        suburb:
          type: string
        preferredDate:
          type: string
        message:
          type: string
        photoUrl:
          type: string
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
        adminNotes:
          type: string
        createdAt:
          type: string
      required:
        - id
        - customerName
        - customerEmail
        - serviceType
        - jobType
        - suburb
        - preferredDate
        - status
        - createdAt

    CreateBookingBody:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        serviceType:
          type: string
          enum: [consulting, quoting, work]
        jobType:
          type: string
        suburb:
          type: string
        preferredDate:
          type: string
        message:
          type: string
        photoUrl:
          type: string
      required:
        - customerName
        - customerEmail
        - serviceType
        - jobType
        - suburb
        - preferredDate

    UpdateBookingStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, confirmed, completed, cancelled]
      required:
        - status

    ConfirmBookingBody:
      type: object
      properties:
        confirmedDate:
          type: string
          description: The scheduled date/time for the job
        adminNote:
          type: string
          description: Optional message to include in the confirmation email
      required:
        - confirmedDate

    PortfolioItem:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        category:
          type: string
        beforeImageUrls:
          type: array
          items:
            type: string
        afterImageUrls:
          type: array
          items:
            type: string
        suburb:
          type: string
        completedDate:
          type: string
        sortOrder:
          type: integer
        createdAt:
          type: string
      required:
        - id
        - title
        - description
        - category
        - afterImageUrls
        - suburb
        - completedDate
        - sortOrder
        - createdAt

    CreatePortfolioItemBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        beforeImageUrls:
          type: array
          items:
            type: string
        afterImageUrls:
          type: array
          items:
            type: string
        suburb:
          type: string
        completedDate:
          type: string
      required:
        - title
        - description
        - category
        - afterImageUrls
        - suburb
        - completedDate

    UpdatePortfolioItemBody:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        category:
          type: string
        beforeImageUrls:
          type: array
          items:
            type: string
        afterImageUrls:
          type: array
          items:
            type: string
        suburb:
          type: string
        completedDate:
          type: string

    ReorderPortfolioItemsBody:
      type: object
      properties:
        ids:
          type: array
          items:
            type: integer
          description: Ordered array of portfolio item IDs
      required:
        - ids

    Review:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        suburb:
          type: string
        rating:
          type: integer
        comment:
          type: string
        serviceType:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected]
        isVerified:
          type: boolean
        createdAt:
          type: string
      required:
        - id
        - customerName
        - suburb
        - rating
        - comment
        - serviceType
        - status
        - isVerified
        - createdAt

    CreateReviewBody:
      type: object
      properties:
        customerName:
          type: string
        suburb:
          type: string
        rating:
          type: integer
        comment:
          type: string
        serviceType:
          type: string
      required:
        - customerName
        - suburb
        - rating
        - comment
        - serviceType

    UpdateReviewStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
      required:
        - status

    QuoteRequest:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        suburb:
          type: string
        jobType:
          type: string
        description:
          type: string
        switchboardImageUrl:
          type: string
        fasciImageUrl:
          type: string
        streetImageUrl:
          type: string
        preferredDate:
          type: string
        preferredTime:
          type: string
        status:
          type: string
          enum: [pending, reviewed, quoted, accepted, declined]
        createdAt:
          type: string
      required:
        - id
        - customerName
        - customerEmail
        - suburb
        - jobType
        - description
        - status
        - createdAt

    CreateQuoteBody:
      type: object
      properties:
        customerName:
          type: string
        customerEmail:
          type: string
        customerPhone:
          type: string
        suburb:
          type: string
        jobType:
          type: string
        description:
          type: string
        switchboardImageUrl:
          type: string
        fasciImageUrl:
          type: string
        streetImageUrl:
          type: string
        preferredDate:
          type: string
        preferredTime:
          type: string
      required:
        - customerName
        - customerEmail
        - suburb
        - jobType
        - description

    UpdateQuoteStatusBody:
      type: object
      properties:
        status:
          type: string
          enum: [pending, reviewed, quoted, accepted, declined]
      required:
        - status

    AnalyticsSummary:
      type: object
      properties:
        totalBookings:
          type: integer
        pendingBookings:
          type: integer
        totalQuotes:
          type: integer
        pendingReviews:
          type: integer
        totalPortfolioItems:
          type: integer
        recentBookingsCount:
          type: integer
        topService:
          type: string
        topRegion:
          type: string
      required:
        - totalBookings
        - pendingBookings
        - totalQuotes
        - pendingReviews
        - totalPortfolioItems
        - recentBookingsCount
        - topService
        - topRegion

    ServiceCount:
      type: object
      properties:
        service:
          type: string
        count:
          type: integer
      required:
        - service
        - count

    RegionCount:
      type: object
      properties:
        region:
          type: string
        count:
          type: integer
      required:
        - region
        - count

    Job:
      type: object
      properties:
        id:
          type: integer
        customerName:
          type: string
        address:
          type: string
        suburb:
          type: string
        jobType:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        status:
          type: string
          enum: [pending, accepted, in_progress, completed]
        priority:
          type: string
          enum: [low, normal, high, urgent]
        estimatedDuration:
          type: string
        totalAmount:
          type: number
        clientName:
          type: string
        clientPhone:
          type: string
        clientEmail:
          type: string
        scheduledDate:
          type: string
        notes:
          type: string
        createdAt:
          type: string
      required:
        - id
        - customerName
        - address
        - suburb
        - jobType
        - latitude
        - longitude
        - status
        - priority
        - createdAt

    CreateJobBody:
      type: object
      properties:
        customerName:
          type: string
        address:
          type: string
        suburb:
          type: string
        jobType:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        priority:
          type: string
          enum: [low, normal, high, urgent]
        estimatedDuration:
          type: string
        totalAmount:
          type: number
        clientName:
          type: string
        clientPhone:
          type: string
        clientEmail:
          type: string
        scheduledDate:
          type: string
        notes:
          type: string
      required:
        - customerName
        - address
