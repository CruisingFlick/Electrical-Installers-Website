<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Electrical Installers</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="hsl(214,60%,14%)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="EI Electrical" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/glightbox/dist/css/glightbox.min.css" />
    <style>
      .glightbox-container .goverlay {
        background: #0a192f;
        opacity: 0.97;
      }
    </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "LocalBusiness",
    "@id": "https://www.electricalinstallers.com.au/#business",
    "name": "Electrical Installers",
    "description": "Victorian licensed electricians serving Mornington Peninsula, Bayside, and South East Melbourne. Specialists in residential and commercial electrical, underground power, renovations, and 3-phase industrial upgrades.",
    "url": "https://www.electricalinstallers.com.au",
    "telephone": "+61419868703",
    "email": "info@electricalinstallers.com.au",
    "logo": "https://www.electricalinstallers.com.au/favicon.png",
    "image": "https://www.electricalinstallers.com.au/favicon.png",
    "priceRange": "$$",
    "currenciesAccepted": "AUD",
    "paymentAccepted": "Cash, Credit Card, Bank Transfer",
    "address": {
      "@type": "PostalAddress",
      "addressRegion": "VIC",
      "addressCountry": "AU"
    },
    "geo": {
      "@type": "GeoCoordinates",
      "latitude": -38.2186,
      "longitude": 145.1974
    },
    "areaServed": [
      {
        "@type": "Place",
        "name": "Mornington Peninsula"
      },
      {
        "@type": "Place",
        "name": "Bayside"
      },
      {
        "@type": "Place",
        "name": "South East Melbourne"
      },
      {
        "@type": "Place",
        "name": "St Kilda"
      },
      {
        "@type": "Place",
        "name": "Warragul"
      }
    ],
    "hasOfferCatalog": {
      "@type": "OfferCatalog",
      "name": "Electrical Services",
      "itemListElement": [
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Residential Electrical" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Commercial Electrical" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Underground Power" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "3-Phase Industrial Upgrades" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Switchboard Upgrades" } },
        { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Renovation Electrical" } }
      ]
    },
    "sameAs": [],
    "openingHoursSpecification": [
      {
        "@type": "OpeningHoursSpecification",
        "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
        "opens": "07:00",
        "closes": "17:00"
      }
    ]
  }
  </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script src="https://cdn.jsdelivr.net/npm/glightbox/dist/js/glightbox.min.js"></script>
  </body>
</html>
