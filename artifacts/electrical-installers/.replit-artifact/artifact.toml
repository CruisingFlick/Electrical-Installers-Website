kind = "web"
previewPath = "/"
title = "Electrical Installers"
version = "1.0.0"
id = "artifacts/electrical-installers"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21315

[services.development]
run = "pnpm --filter @workspace/electrical-installers run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/electrical-installers", "run", "build" ]
publicDir = "artifacts/electrical-installers/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21315"
BASE_PATH = "/"
